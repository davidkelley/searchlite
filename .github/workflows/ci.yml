name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint / Build / Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: 1.88.0
            check_fmt: false
          - toolchain: stable
            check_fmt: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format check
        if: ${{ matrix.check_fmt }}
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all --all-features --all-targets -- -D warnings
      - name: Build
        run: cargo build --all --all-features
      - name: Test
        run: cargo test --all --all-features

  test-wasm-browser:
    name: WASM Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM package
        run: wasm-pack build searchlite-wasm --target web --release
      - name: Run browser tests
        env:
          RUST_TEST_THREADS: "1"
          WASM_BINDGEN_TEST_TIMEOUT: "120"
        run: wasm-pack test --headless --chrome searchlite-wasm

  test-wasm-browser-firefox:
    name: WASM Browser (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM package
        run: wasm-pack build searchlite-wasm --target web --release
      - name: Run browser tests
        env:
          RUST_TEST_THREADS: "1"
          WASM_BINDGEN_TEST_TIMEOUT: "120"
        run: wasm-pack test --headless --firefox searchlite-wasm

  # Full toolchain coverage — only on main
  lint-test-extended:
    name: Extended / ${{ matrix.toolchain }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --all --all-features --all-targets -- -D warnings
      - name: Build
        run: cargo build --all --all-features
      - name: Test
        run: cargo test --all --all-features

  test-node:
    name: Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install dependencies
        working-directory: searchlite-node
        run: npm install
      - name: Build native addon
        working-directory: searchlite-node
        run: npm run build:native:debug
      - name: Build TypeScript
        working-directory: searchlite-node
        run: npm run build:ts
      - name: Typecheck
        working-directory: searchlite-node
        run: npm run typecheck
      - name: Lint
        working-directory: searchlite-node
        run: npm run lint
      - name: Test
        working-directory: searchlite-node
        run: npm test
      - name: Verify package contents
        working-directory: searchlite-node
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack-output.txt
          if ! grep -q '\.node' /tmp/pack-output.txt; then
            echo "::warning::No .node binary found in package — expected in release builds only"
          fi
          grep -q 'dist/index.js' /tmp/pack-output.txt || { echo "::error::dist/index.js missing from package"; exit 1; }
          grep -q 'dist/index.d.ts' /tmp/pack-output.txt || { echo "::error::dist/index.d.ts missing from package"; exit 1; }
      - name: Version sync check
        run: |
          cargo_version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          node_version=$(node -p "require('./searchlite-node/package.json').version")
          if [ "$cargo_version" != "$node_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=$cargo_version package.json=$node_version"
            exit 1
          fi

  bench:
    name: Benchmarks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Benchmarks
        run: cargo bench -p searchlite-core
