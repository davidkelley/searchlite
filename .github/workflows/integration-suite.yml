name: Integration Suite

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: integration-suite-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-pr:
    name: Integration Tests (Quick)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INTEGRATION_MODE: quick
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run integration suite (quick)
        run: cargo test -p integration --all-features

  integration-nightly:
    name: Integration Tests (Full)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INTEGRATION_MODE: full
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run integration suite (full)
        run: cargo test -p integration --all-features
