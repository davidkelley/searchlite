name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  DIST_DIR: dist

jobs:
  build-cli:
    if: startsWith(github.event.release.tag_name, 'searchlite-cli-v')
    name: CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            ext: ""
            install: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            ext: .exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - name: Install target dependencies
        if: ${{ matrix.install != '' }}
        run: ${{ matrix.install }}

      - name: Build CLI
        run: cargo build --release --bin searchlite-cli --target ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-ar' || '' }}

      - name: Package CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIST_DIR"
          repo_root="$PWD"
          bin="target/${{ matrix.target }}/release/searchlite-cli${{ matrix.ext }}"
          name="searchlite-cli-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            export NAME="$name"
            python -c "import os, zipfile; dist=os.environ['DIST_DIR']; target=os.environ['NAME']; bin_path=os.path.join('target','${{ matrix.target }}','release','searchlite-cli${{ matrix.ext }}'); z=zipfile.ZipFile(os.path.join(dist,f'{target}.zip'),'w',compression=zipfile.ZIP_DEFLATED); z.write(bin_path, arcname=os.path.basename(bin_path)); z.write('LICENSE', arcname='LICENSE'); z.write('README.md', arcname='README.md'); z.close()"
          else
            tar -czf "$DIST_DIR/${name}.tar.gz" \
              -C "$(dirname "$bin")" "$(basename "$bin")" \
              -C "$repo_root" LICENSE README.md
          fi

      - name: Upload CLI asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wasm:
    if: startsWith(github.event.release.tag_name, 'searchlite-wasm-v')
    name: WASM bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build wasm package
        run: wasm-pack build --release searchlite-wasm

      - name: Package wasm bundle
        run: |
          set -euo pipefail
          mkdir -p "$DIST_DIR"
          cd searchlite-wasm/pkg
          zip -r "../../$DIST_DIR/searchlite-wasm.zip" .

      - name: Upload wasm asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-node:
    if: startsWith(github.event.release.tag_name, 'searchlite-node-v')
    name: Node.js ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            install: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install target dependencies
        if: ${{ matrix.install != '' }}
        run: ${{ matrix.install }}

      - name: Install npm dependencies
        working-directory: searchlite-node
        run: npm install

      - name: Build native addon
        working-directory: searchlite-node
        run: npx napi build --platform --release --target ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: searchlite-node/searchlite.*.node
          if-no-files-found: error

  publish-node:
    if: startsWith(github.event.release.tag_name, 'searchlite-node-v')
    name: Publish npm package
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm dependencies
        working-directory: searchlite-node
        run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: searchlite-node/artifacts
          pattern: node-*

      - name: Move artifacts into place
        working-directory: searchlite-node
        run: |
          for dir in artifacts/node-*/; do
            cp "$dir"*.node . || { echo "::error::Failed to copy from $dir"; exit 1; }
          done
          ls -la *.node

      - name: Verify all platform binaries present
        working-directory: searchlite-node
        run: |
          expected=$(node -p "require('./package.json').napi.targets.length")
          actual=$(ls -1 *.node | wc -l | tr -d ' ')
          echo "Found $actual of $expected platform binaries"
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::Expected $expected .node binaries, found $actual"
            exit 1
          fi

      - name: Verify version matches release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${TAG_NAME#searchlite-node-v}"
          pkg_version=$(node -p "require('./searchlite-node/package.json').version")
          echo "Tag version: $tag_version"
          echo "Package version: $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package.json ($pkg_version)"
            exit 1
          fi

      - name: Build TypeScript
        working-directory: searchlite-node
        run: npm run build:ts

      - name: Dry run
        working-directory: searchlite-node
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: searchlite-node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker-image:
    if: startsWith(github.event.release.tag_name, 'searchlite-http-v') || startsWith(github.event.release.tag_name, 'searchlite-cli-v')
    name: Publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive release version
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$TAG_NAME"
          if [[ "$tag" =~ -v([0-9].*)$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "$tag" =~ ^v?(.*)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Unable to parse version from tag: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/searchlite:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/searchlite:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
