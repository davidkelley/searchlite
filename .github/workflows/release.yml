name: Release-plz

on:
  push:
    branches: [main]

jobs:
  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'davidkelley' }}
    permissions:
      contents: write
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - &install-release-plz
        name: Install release-plz tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.45, release-plz@0.3.150
      - name: Prepare previous release checkout (for workspace lockfiles)
        id: prev-release
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'searchlite-core-v*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest_tag" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prev_dir="$(mktemp -d)"
          git clone --depth 1 --branch "$latest_tag" . "$prev_dir"

          for member in searchlite-core searchlite-http searchlite-cli searchlite-ffi searchlite-wasm searchlite-node; do
            [ -d "$prev_dir/$member" ] && ln -sf ../Cargo.lock "$prev_dir/$member/Cargo.lock"
          done

          echo "path=$prev_dir/Cargo.toml" >> "$GITHUB_OUTPUT"
      - name: Configure git user
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Run release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          # release-plz detects the previous published version from git tags; the registry manifest
          # lookup that used to be here is no longer required with the current release-plz defaults.
          release-plz release \
            --git-token "${GITHUB_TOKEN}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            -o json

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - *install-release-plz
      - name: Prepare previous release checkout (for workspace lockfiles)
        id: prev-release
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'searchlite-core-v*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest_tag" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prev_dir="$(mktemp -d)"
          git clone --depth 1 --branch "$latest_tag" . "$prev_dir"

          for member in searchlite-core searchlite-http searchlite-cli searchlite-ffi searchlite-wasm searchlite-node; do
            [ -d "$prev_dir/$member" ] && ln -sf ../Cargo.lock "$prev_dir/$member/Cargo.lock"
          done

          echo "path=$prev_dir/Cargo.toml" >> "$GITHUB_OUTPUT"
      - name: Configure git user
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Run release-plz
        id: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          prev="${{ steps.prev-release.outputs.path }}"
          args=()
          if [ -n "$prev" ]; then
            args+=(--registry-manifest-path "$prev")
          fi
          # release-plz detects the previous published version from git tags; the registry manifest
          # lookup that used to be here is no longer required with the current release-plz defaults.
          output=$(release-plz release-pr \
            --git-token "${GITHUB_TOKEN}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            "${args[@]}" \
            -o json)
          echo "$output"
          # Extract the release PR branch name (if a PR was created/updated)
          branch=$(echo "$output" | jq -r '.prs[0].head_branch // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Keep searchlite-node/package.json version in sync with Cargo.toml.
      # release-plz only manages Cargo versions; this step patches package.json
      # on the release PR branch so the CI version-sync check passes.
      - name: Sync package.json version
        if: steps.release-pr.outputs.branch != ''
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          branch="${{ steps.release-pr.outputs.branch }}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "$branch"
          git checkout "$branch"

          cargo_version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          node_version=$(node -p "require('./searchlite-node/package.json').version" 2>/dev/null || echo "")

          if [ -z "$node_version" ]; then
            echo "No searchlite-node/package.json found, skipping"
            exit 0
          fi

          if [ "$cargo_version" = "$node_version" ]; then
            echo "Versions already in sync ($cargo_version)"
            exit 0
          fi

          echo "Syncing package.json $node_version -> $cargo_version"
          sed -i "s/\"version\": \"$node_version\"/\"version\": \"$cargo_version\"/" searchlite-node/package.json

          git add searchlite-node/package.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync package.json version to $cargo_version"
            git push origin "$branch"
          fi
