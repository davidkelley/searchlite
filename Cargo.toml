[workspace]
members = [
  "integration",
  "searchlite-core",
  "searchlite-cli",
  "searchlite-ffi",
  "searchlite-wasm",
  "searchlite-http",
  "searchlite-node",
  "searchlite-adapter-elastic",
  "searchlite-s3",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.7"
authors = ["Searchlite Authors"]
license = "MIT"
repository = "https://github.com/davidkelley/searchlite"
homepage = "https://github.com/davidkelley/searchlite"

[workspace.dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.150"
memmap2 = "0.9.10"
crc32fast = "1.3.2"
hashbrown = "0.17.1"
rayon = "1.12.0"
clap = { version = "4.5.60", features = ["derive"] }
rand = "0.9.4"
criterion = { version = "0.8.2", features = ["cargo_bench_support"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde", "clock"] }
byteorder = "1.5.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
serde_with = "3.20.0"
parking_lot = "0.12.1"
smallvec = "1.11.2"
bincode = "1.3.3"
env_logger = "0.11.10"
tempfile = "3.27.0"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.2"
rust-stemmers = "1.2.0"
regex = "1.10.4"
tdigest = "0.2.3"
log = "0.4.30"
argon2 = { version = "0.5", default-features = false, features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
