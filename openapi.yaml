openapi: 3.0.3
info:
  title: Searchlite HTTP API
  version: "0.1.0"
  description: >
    HTTP surface for one or more mounted Searchlite indexes. All mutating and search
    endpoints are scoped by index name via the `/indexes/{name}/...` path prefix. The
    search request schema matches `search-request.schema.json`; the init schema matches
    `index-schema.json`.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /indexes:
    get:
      summary: List configured indexes and aliases
      responses:
        "200":
          description: Names and runtime metadata for mounted indexes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexListResponse"
  /indexes/{name}/init:
    post:
      summary: Create a new index if missing
      parameters:
        - $ref: "#/components/parameters/IndexName"
        - $ref: "#/components/parameters/WriteKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./index-schema.json"
      responses:
        "200":
          description: Index created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitResponse"
        "400":
          description: Invalid schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Index already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/add:
    post:
      summary: Upsert documents via streaming NDJSON
      description: >
        The request body must be newline-delimited JSON documents. Each line is parsed
        as a document object whose keys map to schema fields (including `_id`). Writes are
        queued in the index writer; call `/indexes/{name}/commit` (and optionally
        `/indexes/{name}/refresh`) to make them durable and visible to searches.
      parameters:
        - $ref: "#/components/parameters/IndexName"
        - $ref: "#/components/parameters/WriteKeyHeader"
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              $ref: "#/components/schemas/Document"
      responses:
        "200":
          description: Documents queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/bulk:
    post:
      summary: Upsert documents with a JSON payload
      description: >
        Upsert a JSON array of documents; writes are queued in the index writer and require
        `/indexes/{name}/commit` (and optionally `/indexes/{name}/refresh`) before they become
        visible to searches.
      parameters:
        - $ref: "#/components/parameters/IndexName"
        - $ref: "#/components/parameters/WriteKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRequest"
      responses:
        "200":
          description: Documents queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/update:
    post:
      summary: Update document fields
      description: >
        Partially update stored fields using `set`/`unset`. Updates are queued in the index
        writer and require `/indexes/{name}/commit` (and optionally `/indexes/{name}/refresh`)
        before they become visible to searches. Updates are rejected when the schema defines
        vector fields because vector values are not stored.
      parameters:
        - $ref: "#/components/parameters/IndexName"
        - $ref: "#/components/parameters/WriteKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequest"
      responses:
        "200":
          description: Update queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document or index missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/_bulk_update:
    post:
      summary: Bulk update documents with NDJSON pairs
      description: >
        Send NDJSON pairs consisting of an update action line and a patch line. The server
        processes updates in best-effort mode and returns per-item status. Updates are queued
        and require `/indexes/{name}/commit` before they become visible. Updates are rejected
        when the schema defines vector fields because vector values are not stored.
      parameters:
        - $ref: "#/components/parameters/IndexName"
        - $ref: "#/components/parameters/WriteKeyHeader"
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
            example: |
              {"update":{"_id":"1"}}
              {"set":{"available":8},"unset":["metadata.alt"]}
              {"update":{"_id":"missing"}}
              {"set":{"available":0}}
      responses:
        "200":
          description: Bulk update results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResponse"
        "400":
          description: Invalid NDJSON or update payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/delete:
    post:
      summary: Queue document deletions by id
      description: >
        Deletes are queued in the index writer and require a subsequent `/indexes/{name}/commit`
        (and optional `/indexes/{name}/refresh`) to take effect.
      parameters:
        - $ref: "#/components/parameters/IndexName"
        - $ref: "#/components/parameters/WriteKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
      responses:
        "200":
          description: Deletes queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/commit:
    post:
      summary: Flush WAL to immutable segments
      description: Persist queued writes/deletes; combine with `/indexes/{name}/refresh` if you want readers reloaded.
      parameters:
        - $ref: "#/components/parameters/IndexName"
        - $ref: "#/components/parameters/WriteKeyHeader"
      responses:
        "200":
          description: Commit complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/refresh:
    post:
      summary: Refresh readers (lightweight)
      description: Trigger a lightweight reload of index readers without modifying index contents.
      parameters:
        - $ref: "#/components/parameters/IndexName"
      responses:
        "200":
          description: Refresh acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/compact:
    post:
      summary: Merge segments to reduce fragmentation
      parameters:
        - $ref: "#/components/parameters/IndexName"
        - $ref: "#/components/parameters/WriteKeyHeader"
      responses:
        "200":
          description: Compaction completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/search:
    post:
      summary: Execute a search, aggregation, suggest, or vector query
      parameters:
        - $ref: "#/components/parameters/IndexName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./search-request.schema.json"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          description: Invalid search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/mget:
    post:
      summary: Fetch stored documents by id
      parameters:
        - $ref: "#/components/parameters/IndexName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MgetRequest"
      responses:
        "200":
          description: Documents found or missing by id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MgetResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/multi_search:
    post:
      summary: Execute multiple searches in one request
      parameters:
        - $ref: "#/components/parameters/IndexName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiSearchRequest"
      responses:
        "200":
          description: Search results for each request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSearchResponse"
        "400":
          description: Invalid search request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/inspect:
    get:
      summary: Inspect manifest and segment metadata
      parameters:
        - $ref: "#/components/parameters/IndexName"
      responses:
        "200":
          description: Current manifest snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /indexes/{name}/stats:
    get:
      summary: Lightweight index stats
      parameters:
        - $ref: "#/components/parameters/IndexName"
      responses:
        "200":
          description: Stats payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "404":
          description: Index missing or uninitialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    IndexName:
      name: name
      in: path
      required: true
      description: Logical index name configured at startup (aliases allowed)
      schema:
        type: string
    WriteKeyHeader:
      name: X-Write-Key
      in: header
      required: false
      schema:
        type: string
      description: Optional write key. Required for any write operation when the index was created with a write key.
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
            reason:
              type: string
          required: [type, reason]
      required: [error]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    IndexDescriptor:
      type: object
      properties:
        name:
          type: string
        exists:
          type: boolean
        committed_at:
          type: string
          nullable: true
        doc_count:
          type: integer
          format: int64
          nullable: true
        auto_commit_secs:
          type: integer
          format: int64
        auto_refresh_secs:
          type: integer
          format: int64
        refresh_on_commit:
          type: boolean
      required:
        [
          name,
          exists,
          auto_commit_secs,
          auto_refresh_secs,
          refresh_on_commit,
        ]
    AliasDescriptor:
      type: object
      properties:
        alias:
          type: string
        target:
          type: string
      required: [alias, target]
    IndexListResponse:
      type: object
      properties:
        indexes:
          type: array
          items:
            $ref: "#/components/schemas/IndexDescriptor"
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/AliasDescriptor"
      required: [indexes, aliases]
    InitResponse:
      type: object
      properties:
        created:
          type: boolean
      required: [created]
    IngestResponse:
      type: object
      properties:
        queued:
          type: integer
          format: int64
      required: [queued]
    DeleteRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
      required: [ids]
    DeleteResponse:
      type: object
      properties:
        queued:
          type: integer
          format: int64
      required: [queued]
    MgetRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 1024
        return_stored:
          type: boolean
          default: false
      required: [ids]
    MgetDoc:
      type: object
      properties:
        doc_id:
          type: string
        found:
          type: boolean
        _source:
          type: object
          nullable: true
          additionalProperties: true
      required: [doc_id, found]
    MgetResponse:
      type: object
      properties:
        docs:
          type: array
          items:
            $ref: "#/components/schemas/MgetDoc"
      required: [docs]
    MultiSearchRequest:
      type: object
      properties:
        searches:
          type: array
          items:
            $ref: "./search-request.schema.json"
        parallel:
          type: boolean
          default: false
        max_concurrency:
          type: integer
          nullable: true
          minimum: 1
          maximum: 16
          default: 4
      required: [searches]
    MultiSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
      required: [results]
    CommitResponse:
      type: object
      properties:
        committed:
          type: boolean
      required: [committed]
    RefreshResponse:
      type: object
      properties:
        refreshed:
          type: boolean
      required: [refreshed]
    CompactResponse:
      type: object
      properties:
        compacted:
          type: boolean
      required: [compacted]
    BulkRequest:
      type: object
      properties:
        docs:
          type: array
          items:
            $ref: "#/components/schemas/Document"
      required: [docs]
    UpdateRequest:
      type: object
      properties:
        id:
          type: string
        set:
          type: object
          additionalProperties: true
          default: {}
        unset:
          type: array
          items:
            type: string
          default: []
      required: [id]
    UpdateResponse:
      type: object
      properties:
        accepted:
          type: boolean
      required: [accepted]
    BulkUpdateItem:
      type: object
      properties:
        id:
          type: string
        status:
          type: integer
          format: int32
        error:
          type: string
          nullable: true
      required: [id, status]
    BulkUpdateResponse:
      type: object
      properties:
        updated:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/BulkUpdateItem"
      required: [updated, failed, items]
    Document:
      type: object
      description: |
        Arbitrary JSON object keyed by schema field names. `_id` (or `doc_id_field`)
        is required for upsert/delete semantics.
      additionalProperties: true
    InspectResponse:
      type: object
      properties:
        manifest:
          $ref: "#/components/schemas/Manifest"
      required: [manifest]
    Manifest:
      type: object
      properties:
        version:
          type: integer
          format: int32
        uuid:
          type: string
          format: uuid
        committed_at:
          type: string
          description: RFC 3339 timestamp
        schema:
          $ref: "./index-schema.json"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/SegmentMeta"
      required: [version, uuid, committed_at, schema, segments]
    SegmentMeta:
      type: object
      properties:
        id:
          type: string
        generation:
          type: integer
          format: int32
        doc_count:
          type: integer
          format: int64
        max_doc_id:
          type: integer
          format: int64
        blockmax:
          type: boolean
        deleted_docs:
          type: array
          items:
            type: integer
            format: int64
        paths:
          $ref: "#/components/schemas/SegmentPaths"
      required: [id, generation, doc_count, max_doc_id, blockmax, deleted_docs, paths]
    SegmentPaths:
      type: object
      properties:
        terms:
          type: string
        postings:
          type: string
        docstore:
          type: string
        fast:
          type: string
        meta:
          type: string
        vector_dir:
          type: string
          nullable: true
      required: [terms, postings, docstore, fast, meta]
    StatsResponse:
      type: object
      properties:
        documents:
          type: integer
          format: int64
        deleted_documents:
          type: integer
          format: int64
        segments:
          type: integer
          format: int32
        committed_at:
          type: string
        index_uuid:
          type: string
        index_name:
          type: string
      required: [documents, deleted_documents, segments, committed_at, index_uuid, index_name]
    SearchResult:
      type: object
      properties:
        total_hits_estimate:
          type: integer
          format: int64
        total_groups:
          type: integer
          format: int64
          nullable: true
        hits:
          type: array
          items:
            $ref: "#/components/schemas/Hit"
        next_cursor:
          type: string
          nullable: true
        next_search_after:
          type: array
          nullable: true
          items: {}
          description: Sort token for the next page (sort values + doc_id + segment ord).
        aggregations:
          type: object
          additionalProperties: true
        suggest:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestResult"
        profile:
          type: object
          nullable: true
      required: [total_hits_estimate, hits]
    Hit:
      type: object
      properties:
        doc_id:
          type: string
        score:
          type: number
        vector_score:
          type: number
          nullable: true
        sort_key:
          type: array
          nullable: true
          items: {}
          description: Sort token to feed into search_after for this hit.
        fields:
          type: object
          nullable: true
        snippet:
          type: string
          nullable: true
        highlights:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
      required: [doc_id, score]
    SuggestResult:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/SuggestOption"
      required: [options]
    SuggestOption:
      type: object
      properties:
        text:
          type: string
        score:
          type: number
        doc_freq:
          type: integer
          format: int64
      required: [text, score, doc_freq]
