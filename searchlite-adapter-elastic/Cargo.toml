[package]
name = "searchlite-adapter-elastic"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Elasticsearch-compatible HTTP adapter for searchlite (translates ES query DSL to native API)"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["search", "elasticsearch", "adapter", "proxy", "compatibility"]
categories = ["web-programming::http-server", "database"]

[[bin]]
name = "searchlite-elastic"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = "0.8.9"
clap = { workspace = true, features = ["derive", "env"] }
futures-util = "0.3.32"
percent-encoding = "2.3"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "io-util"] }
tower = { version = "0.5.3", features = ["timeout", "limit"] }
tower-http = { version = "0.7.0", features = ["limit", "trace"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tempfile = { workspace = true }
