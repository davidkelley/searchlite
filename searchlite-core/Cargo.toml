[package]
name = "searchlite-core"
version = "0.8.2"
edition = "2021"
authors = ["Searchlite Authors"]
license = "MIT"
description = "Embedded search engine core for searchlite"

[features]
default = []
browser = []
vectors = ["bytemuck", "bincode"]
gpu = []
zstd = ["dep:zstd"]
ffi = []
write-key = ["dep:argon2", "dep:hmac", "dep:subtle"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["executor"] }
serde = { workspace = true }
serde_json = { workspace = true }
crc32fast = { workspace = true }
hashbrown = { workspace = true }
rayon = { workspace = true, optional = false }
uuid = { workspace = true }
chrono = { workspace = true }
byteorder = { workspace = true }
bytemuck = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
serde_with = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
rust-stemmers = { workspace = true }
regex = { workspace = true }
tdigest = { workspace = true }
log = { workspace = true }
argon2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true, optional = true }
rand = { workspace = true }

zstd = { version = "0.13.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = { workspace = true }
fs2 = "0.4"
moka = { version = "0.12", default-features = false, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
# rand 0.9 transitively pulls in getrandom 0.3, which needs the wasm_js
# feature on wasm32 targets (paired with the `getrandom_backend="wasm_js"`
# rustflag set in searchlite-wasm/.cargo/config.toml).
getrandom_v03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3.69"

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }
tempfile = "3.27.0"

[lib]
name = "searchlite_core"
path = "src/lib.rs"

[[bench]]
name = "aggs"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "scale"
harness = false
