[package]
name = "searchlite-http"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Axum-based HTTP server exposing searchlite indexes (search, mget, msearch, write)"
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["search", "http", "server", "index", "bm25"]
categories = ["web-programming::http-server", "database"]

[features]
default = []
vectors = ["searchlite-core/vectors", "searchlite-s3?/vectors"]
gpu = ["searchlite-core/gpu"]
zstd = ["searchlite-core/zstd"]
# `--index name:s3://bucket/prefix` mount form for read-only S3-backed
# indexes. Pulls in `searchlite-s3` (and `aws-sdk-s3`). Off by default
# at the crate level; the CLI binary turns this on via its own `s3`
# feature, which is on by default.
s3 = ["dep:searchlite-s3"]

[dependencies]
anyhow = { workspace = true }
axum = "0.8.9"
clap = { workspace = true, features = ["derive", "env"] }
futures-util = "0.3.32"
searchlite-core = { path = "../searchlite-core", version = "0.9.1", package = "searchlite-core", features = ["write-key"] }
searchlite-s3 = { path = "../searchlite-s3", version = "0.2.7", package = "searchlite-s3", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "io-util"] }
tokio-util = { version = "0.7.10", features = ["io"] }
tower = { version = "0.5.3", features = ["timeout", "limit"] }
tower-http = { version = "0.7.0", features = ["limit", "trace"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "io-util"] }
