[package]
name = "searchlite-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node.js native addon for searchlite"
publish = false

[features]
# `vectors` is on by default so the published `searchlite-js` binary supports
# vector / hybrid search and `searchlite:vector` schemas out of the box. Without
# it, a schema containing a vector field hard-errors at parse time and
# `QueryNode::Vector` fails to deserialize.
default = ["vectors"]
vectors = ["searchlite-core/vectors"]
zstd = ["searchlite-core/zstd"]

[dependencies]
searchlite-core = { path = "../searchlite-core", features = ["write-key", "tokio-runtime"] }
searchlite-s3 = { path = "../searchlite-s3" }
napi = { version = "3", features = ["serde-json", "napi9", "async"] }
napi-derive = "3"
serde_json = { workspace = true }
anyhow = { workspace = true }

[build-dependencies]
napi-build = "2"

[lib]
crate-type = ["cdylib"]
