[package]
name = "searchlite-s3"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "S3-compatible BlobStore implementation for searchlite (AWS S3, R2, MinIO)"

[lib]
path = "src/lib.rs"

# Stage 10b: aws-sdk-s3 doesn't compile on wasm32 (depends on tokio reactor +
# native TLS). Wasm consumers continue on the StorageAsBlobStore path inside
# searchlite-core; this crate is non-wasm-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
searchlite-core = { path = "../searchlite-core", features = ["tokio-runtime"] }
anyhow = { workspace = true }
async-trait = "0.1"
base64 = { workspace = true }
bytes = "1"
log = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wiremock = "0.6"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
