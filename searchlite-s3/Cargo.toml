[package]
name = "searchlite-s3"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
description = "S3-compatible BlobStore implementation for searchlite (AWS S3, R2, MinIO)"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["search", "s3", "r2", "minio", "blobstore"]
categories = ["database", "web-programming"]

[lib]
path = "src/lib.rs"

[features]
# Forwards the `vectors` feature to searchlite-core so this crate can
# inspect vector artifacts on a vector-enabled index. With this feature
# off, sync_to_s3 still works for vector-built indexes (it uploads every
# file the walker sees), but the preflight does not validate that each
# declared vector field's per-segment `*.bin` / `*.hnsw` files exist.
vectors = ["searchlite-core/vectors"]

# aws-sdk-s3 doesn't compile on wasm32 (depends on tokio reactor + native
# TLS). Wasm consumers continue on the StorageAsBlobStore path inside
# searchlite-core; this crate is non-wasm-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
searchlite-core = { path = "../searchlite-core", version = "0.9.1", features = ["tokio-runtime"] }
anyhow = { workspace = true }
async-trait = "0.1"
base64 = { workspace = true }
bytes = "1"
log = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
aws-smithy-types = "1"
aws-smithy-runtime-api = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wiremock = "0.6"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
crc32fast = { workspace = true }
searchlite-core = { path = "../searchlite-core", version = "0.9.1", features = ["tokio-runtime"] }
